services:
  backend:
    build: .
    container_name: openshorts-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/__pycache__
      - D:/clips/stelzon:/app/output
    environment:
      - AUTO_CLEANUP_ENABLED=true
      - JOB_RETENTION_SECONDS=604800
      - SOURCE_RETENTION_SECONDS=604800
      - UPLOAD_TTL_SECONDS=604800
      - OUTPUT_MAX_GB=0
      - UPLOADS_MAX_GB=0
      - MAX_FILE_SIZE_MB=16384
    restart: unless-stopped

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "3100:3100"
    volumes:
      - D:/clips/stelzon:/output
    environment:
      - REMOTION_BUNDLE_PATH=/app/remotion
      - OUTPUT_DIR=/output
      - PORT=3100
    restart: unless-stopped
    depends_on:
      - backend
